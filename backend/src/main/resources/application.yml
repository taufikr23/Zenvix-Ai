spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: documind-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/documind}
    username: ${DB_USERNAME:documind}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:11MB}

server:
  tomcat:
    max-swallow-size: ${MAX_REQUEST_SIZE:11MB}
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,vector

app:
  chat:
    enabled: ${CHAT_ENABLED:false}
    model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
    timeout-ms: ${CHAT_TIMEOUT_MS:90000}
    max-output-tokens: ${CHAT_MAX_OUTPUT_TOKENS:1024}
    top-k: ${CHAT_TOP_K:5}
    min-similarity: ${CHAT_MIN_SIMILARITY:0.45}
    max-context-characters: ${CHAT_MAX_CONTEXT_CHARACTERS:6000}
    max-turns: ${CHAT_MAX_TURNS:50}
    max-conversations: ${CHAT_MAX_CONVERSATIONS:100}
    daily-requests: ${CHAT_DAILY_REQUESTS:500}
    user-daily-requests: ${CHAT_USER_DAILY_REQUESTS:50}
    daily-characters: ${CHAT_DAILY_CHARACTERS:10000000}
    user-daily-characters: ${CHAT_USER_DAILY_CHARACTERS:2000000}
  indexing:
    enabled: ${EMBEDDING_ENABLED:false}
    scheduler-enabled: true
    poll-delay-ms: ${EMBEDDING_POLL_DELAY_MS:1000}
    api-key: ${GEMINI_API_KEY:}
    timeout-ms: ${EMBEDDING_TIMEOUT_MS:20000}
    daily-characters: ${EMBEDDING_DAILY_CHARACTERS:200000}
    user-daily-characters: ${EMBEDDING_USER_DAILY_CHARACTERS:50000}
  processing:
    enabled: ${PROCESSING_ENABLED:true}
    poll-delay-ms: ${PROCESSING_POLL_DELAY_MS:1000}
    chunk-size: ${CHUNK_SIZE:1000}
    chunk-overlap: ${CHUNK_OVERLAP:150}
    max-characters: ${MAX_EXTRACTED_CHARACTERS:2000000}
    max-chunks: ${MAX_CHUNKS:3000}
    timeout-seconds: ${PROCESSING_TIMEOUT_SECONDS:60}
  storage:
    root: ${STORAGE_ROOT:./data/documents}
    max-documents-per-user: ${MAX_DOCUMENTS_PER_USER:50}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:documind-ai}
    audience: ${JWT_AUDIENCE:documind-api}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
